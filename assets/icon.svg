<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transcription Vocale FR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="mic" x1="128" y1="40" x2="128" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#2b64d6"/>
    </linearGradient>
    <linearGradient id="wave" x1="40" y1="128" x2="216" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7db4ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fond arrondi -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2e3a52" stroke-opacity="0.6"/>

  <!-- ondes sonores gauche -->
  <g stroke="url(#wave)" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M56 108 L56 148" stroke-width="7"/>
    <path d="M74 92 L74 164" stroke-width="7"/>
    <path d="M92 116 L92 140" stroke-width="7"/>
  </g>
  <!-- ondes sonores droite -->
  <g stroke="url(#wave)" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M200 108 L200 148" stroke-width="7"/>
    <path d="M182 92 L182 164" stroke-width="7"/>
    <path d="M164 116 L164 140" stroke-width="7"/>
  </g>

  <!-- micro -->
  <g filter="url(#glow)">
    <rect x="110" y="52" width="36" height="76" rx="18" fill="url(#mic)"/>
    <path d="M96 118 a32 32 0 0 0 64 0" fill="none" stroke="url(#mic)" stroke-width="9" stroke-linecap="round"/>
    <line x1="128" y1="150" x2="128" y2="176" stroke="url(#mic)" stroke-width="9" stroke-linecap="round"/>
    <line x1="108" y1="176" x2="148" y2="176" stroke="url(#mic)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- badge FR (lettres en tracés pour un rendu fiable partout) -->
  <g>
    <rect x="148" y="148" width="62" height="38" rx="11" fill="#2b64d6"/>
    <!-- lettre F -->
    <g fill="#ffffff">
      <rect x="161" y="157" width="6" height="20" rx="1"/>
      <rect x="161" y="157" width="15" height="6" rx="1"/>
      <rect x="161" y="164" width="11" height="6" rx="1"/>
    </g>
    <!-- lettre R -->
    <g fill="#ffffff">
      <rect x="184" y="157" width="6" height="20" rx="1"/>
      <path d="M184 157 h11 a7 7 0 0 1 0 14 h-11 v-6 h11 a1 1 0 0 0 0-2 h-11 z"/>
      <path d="M191 169 l7 8 h-7 l-6 -7 z"/>
    </g>
  </g>
</svg>
