name: Build & Release (Windows)

# Compile l'application en exécutable Windows autonome et publie une release
# à chaque tag de version (ex. v1.0.0). Peut aussi être lancé manuellement.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Nom du tag pour la release (ex. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      # Note : aucun ffmpeg externe n'est nécessaire — PyAV (dépendance de
      # faster-whisper) embarque ses propres bibliothèques FFmpeg.

      - name: Compiler l'exécutable (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean app.spec
          if (-not (Test-Path "dist/$env:APP_DIR/$env:APP_DIR.exe")) {
            throw "Exécutable introuvable après build"
          }
        env:
          APP_DIR: "Transcription Vocale FR"

      # Signature de code (certificat AUTO-SIGNÉ).
      # Note : un certificat auto-signé ne supprime PAS l'alerte SmartScreen
      # (autorité non reconnue par Windows), mais il « signe » l'exécutable
      # (éditeur + intégrité), ce qui aide certains antivirus et le sérieux.
      # Pour supprimer SmartScreen, il faut un certificat OV/EV d'une autorité.
      - name: Créer un certificat auto-signé et signer l'exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Adrien10200, O=Adrien10200, C=FR" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Transcription Vocale FR (self-signed)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool introuvable" }
          $exe = "dist\Transcription Vocale FR\Transcription Vocale FR.exe"
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint `
            /tr http://timestamp.digicert.com /td SHA256 $exe
          Write-Host "Exe signé (auto-signé)."
          # Conserve l'empreinte pour signer aussi l'installeur ensuite.
          "THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Déterminer le nom de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag }}" -ne "") {
            $v = "${{ github.event.inputs.tag }}"
          } else {
            $v = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          Write-Host "Version : $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Archiver l'application (ZIP portable)
        shell: pwsh
        run: |
          $name = "Transcription-Vocale-FR-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path "dist/Transcription Vocale FR/*" -DestinationPath $name -Force
          Write-Host "Archive créée : $name"
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: package

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installeur (Inno Setup)
        id: installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer.iss
          # Exclut explicitement la variante GPU : les deux installeurs portent
          # l'extension .exe et « -gpu-amd » passe AVANT par ordre alphabétique.
          $setup = Get-ChildItem "installer_output\*.exe" |
                   Where-Object { $_.Name -notmatch 'gpu' } | Select-Object -First 1
          if (-not $setup) { throw "Installeur introuvable après compilation" }
          Write-Host "Installeur créé : $($setup.Name)"
          "installer=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Signer l'installeur (auto-signé)
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" sign /fd SHA256 /sha1 "$env:THUMBPRINT" `
            /tr http://timestamp.digicert.com /td SHA256 `
            "${{ steps.installer.outputs.installer }}"
          Write-Host "Installeur signé (auto-signé)."

      - name: Téléverser les artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: application-windows
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.installer.outputs.installer }}
          retention-days: 30

      - name: Publier la release
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Transcription Vocale FR ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.installer.outputs.installer }}
          body: |
            ## Transcription Vocale FR — ${{ steps.version.outputs.version }}

            Application Windows de transcription vocale française
            (haute précision, 100 % en local).

            ### Installation (recommandé) — programme d'installation
            1. Téléchargez **`TranscriptionVocaleFR-Setup-….exe`**.
            2. Lancez-le (aucun droit administrateur requis).
            3. Le modèle est mis en cache **hors** du dossier de l'app : les
               futures mises à jour **ne re-téléchargent jamais** les ~3 Go.

            ### Version portable (ZIP)
            1. Téléchargez le `.zip`, décompressez-le où vous voulez.
            2. Lancez **`Transcription Vocale FR.exe`**.

            > Au premier lancement, le modèle `large-v3` (~3 Go) est téléchargé
            > automatiquement puis mis en cache. Les lancements suivants sont
            > immédiats.

            ### Accélération GPU AMD (optionnel)
            L'archive **`…-win64-gpu-amd.zip`** embarque le moteur ROCm : elle
            utilise la carte graphique sur Radeon **RX 7000** (RDNA3) et APU
            Strix (RDNA3.5), sans rien installer de plus. Bien plus rapide, mais
            plus lourde à télécharger. En cas de doute, prenez la version CPU
            ci-dessus, qui fonctionne partout.

  # ------------------------------------------------------------------ #
  # Variante GPU AMD (ROCm). Build séparée, publiée en plus de la build
  # CPU : elle embarque le moteur ROCm et ne concerne que les Radeon
  # RDNA3 / RDNA3.5. La build CPU ci-dessus reste la version par défaut.
  # ------------------------------------------------------------------ #
  build-gpu-amd:
    runs-on: windows-latest

    env:
      ROCM_REL: "7.2.1"
      CT2_VERSION: "4.7.1"
      # RDNA3 (RX 7000) + RDNA3.5 (APU Strix). RDNA4 exclu : +542 Mo de
      # noyaux et CTranslate2 4.7.1 y est signalé instable (#2021).
      GFX_TARGETS: "gfx1100,gfx1101,gfx1102,gfx1150,gfx1151"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Installer le runtime ROCm
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://repo.radeon.com/rocm/windows/rocm-rel-$env:ROCM_REL"
          pip install --no-cache-dir --no-deps `
            "$base/rocm_sdk_core-$env:ROCM_REL-py3-none-win_amd64.whl" `
            "$base/rocm_sdk_libraries_custom-$env:ROCM_REL-py3-none-win_amd64.whl" `
            "$base/rocm-$env:ROCM_REL.tar.gz"

      - name: Installer CTranslate2 (build ROCm)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:CT2_VERSION"
          gh release download $tag --repo OpenNMT/CTranslate2 `
            --pattern "rocm-python-wheels-Windows.zip" --dir ct2 --clobber
          Expand-Archive -Path "ct2\rocm-python-wheels-Windows.zip" -DestinationPath ct2\x -Force
          $py = "cp311"
          $whl = Get-ChildItem -Recurse ct2\x -Filter "ctranslate2-$env:CT2_VERSION-$py-$py-win_amd64.whl" |
                 Select-Object -First 1
          if (-not $whl) { throw "Roue ROCm $py introuvable dans l'archive" }
          # Remplace la roue CUDA de PyPI par la roue ROCm.
          pip install --no-cache-dir --force-reinstall --no-deps $whl.FullName
          python -c "import ctranslate2; print('CTranslate2', ctranslate2.__version__)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Alléger ROCm (retrait de l'outillage et des autres GPU)
        shell: pwsh
        run: |
          $sp = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          python packaging/prune_rocm.py --site-packages "$sp" --targets "$env:GFX_TARGETS"

      - name: Compiler l'exécutable (PyInstaller, variante GPU)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:TVFR_GPU_BUNDLE = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          python -m PyInstaller --noconfirm --clean app.spec
          $exe = "dist\Transcription Vocale FR\Transcription Vocale FR.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable introuvable après build" }
          # Vérifie que ROCm a bien atterri à l'emplacement attendu par
          # ctranslate2 (frère du paquet, sinon add_dll_directory échoue).
          $rocm = "dist\Transcription Vocale FR\_internal\_rocm_sdk_core\bin"
          if (-not (Test-Path $rocm)) { throw "ROCm absent du bundle : $rocm" }
          Write-Host "ROCm embarqué OK."

      - name: Déterminer le nom de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag }}" -ne "") {
            $v = "${{ github.event.inputs.tag }}"
          } else {
            $v = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Signer l'exe (certificat auto-signé)
        id: sign
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Adrien10200, O=Adrien10200, C=FR" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Transcription Vocale FR (self-signed)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool introuvable" }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist\Transcription Vocale FR\Transcription Vocale FR.exe"
          "THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Archiver la variante GPU (ZIP)
        id: package
        shell: pwsh
        run: |
          $name = "Transcription-Vocale-FR-${{ steps.version.outputs.version }}-win64-gpu-amd.zip"
          Compress-Archive -Path "dist/Transcription Vocale FR/*" -DestinationPath $name -Force
          $mb = [math]::Round((Get-Item $name).Length / 1MB)
          Write-Host "Archive GPU créée : $name ($mb Mo)"
          if ((Get-Item $name).Length -ge 2GB) {
            throw "Archive >= 2 Go : au-delà de la limite d'un asset GitHub"
          }
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installeur GPU (Inno Setup)
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.version.outputs.version }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$ver /DGpuVariant=1 installer.iss
          $setup = Get-ChildItem "installer_output\*gpu-amd*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installeur GPU introuvable après compilation" }
          $mb = [math]::Round($setup.Length / 1MB)
          Write-Host "Installeur GPU créé : $($setup.Name) ($mb Mo)"
          if ($setup.Length -ge 2GB) {
            throw "Installeur >= 2 Go : au-delà de la limite d'un asset GitHub"
          }
          "installer=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Signer l'installeur GPU
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" sign /fd SHA256 /sha1 "$env:THUMBPRINT" `
            /tr http://timestamp.digicert.com /td SHA256 `
            "${{ steps.installer.outputs.installer }}"

      - name: Téléverser les artefacts GPU
        uses: actions/upload-artifact@v4
        with:
          name: application-windows-gpu-amd
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.installer.outputs.installer }}
          retention-days: 30

      # La variante GPU s'AJOUTE à la release créée par le job « build ».
      # Ce job ne définit ni le titre ni le corps : il ne fait qu'attacher son
      # archive, pour ne pas écraser ce que l'autre job a publié.
      - name: Ajouter la variante GPU à la release
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.installer.outputs.installer }}
