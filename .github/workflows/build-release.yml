name: Build & Release (Windows)

# Compile l'application en exécutable Windows autonome et publie une release
# à chaque tag de version (ex. v1.0.0). Peut aussi être lancé manuellement.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Nom du tag pour la release (ex. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Télécharger ffmpeg portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $dest = "tools"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $zip = Join-Path $dest "ffmpeg.zip"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Téléchargement de ffmpeg…"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $src = Get-ChildItem -Path $dest -Directory -Filter "ffmpeg-master-*" | Select-Object -First 1
          $target = Join-Path $dest "ffmpeg"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          Move-Item -Path $src.FullName -Destination $target
          Remove-Item $zip -Force
          if (-not (Test-Path (Join-Path $target "bin\ffmpeg.exe"))) {
            throw "ffmpeg.exe introuvable après extraction"
          }
          Write-Host "ffmpeg prêt : $target\bin\ffmpeg.exe"

      - name: Compiler l'exécutable (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean app.spec
          if (-not (Test-Path "dist/$env:APP_DIR/$env:APP_DIR.exe")) {
            throw "Exécutable introuvable après build"
          }
        env:
          APP_DIR: "Transcription Vocale FR"

      - name: Déterminer le nom de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag }}" -ne "") {
            $v = "${{ github.event.inputs.tag }}"
          } else {
            $v = "dev-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          Write-Host "Version : $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Archiver l'application (ZIP)
        shell: pwsh
        run: |
          $name = "Transcription-Vocale-FR-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path "dist/Transcription Vocale FR/*" -DestinationPath $name -Force
          Write-Host "Archive créée : $name"
          "asset=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: package

      - name: Téléverser l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: application-windows
          path: ${{ steps.package.outputs.asset }}
          retention-days: 30

      - name: Publier la release
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Transcription Vocale FR ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
          body: |
            ## Transcription Vocale FR — ${{ steps.version.outputs.version }}

            Application Windows autonome de transcription vocale française
            (haute précision, 100 % en local).

            ### Installation
            1. Téléchargez le fichier `.zip` ci-dessous.
            2. Décompressez-le où vous voulez.
            3. Lancez **`Transcription Vocale FR.exe`**.

            > Au premier lancement, le modèle `large-v3` (~3 Go) est téléchargé
            > automatiquement puis mis en cache localement. Les lancements
            > suivants sont immédiats.
